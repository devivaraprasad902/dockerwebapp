version: "3.9"

services:
  devopsdb:
    image: devi1999/databaseimage
    ports:
      - "1112:3306"
    deploy:
      replicas: 1
    networks:
      - mynetwork

  application:
    image: devi1999/quickfeed
    ports:
      - "1111:8080"
    deploy:
      replicas: 1
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
